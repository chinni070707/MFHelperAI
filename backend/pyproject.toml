[tool.pytest.ini_options]
# Pytest configuration
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Output options
addopts = [
    "-v",                           # Verbose output
    "--strict-markers",             # Strict marker enforcement
    "--tb=short",                   # Short traceback format
    "--disable-warnings",           # Disable warnings
    "-ra",                          # Show extra test summary
    "--cov=app",                    # Coverage for app directory
    "--cov-report=html",            # HTML coverage report
    "--cov-report=term-missing",    # Show missing lines in terminal
    "--cov-branch",                 # Branch coverage
]

# Markers for test categorization
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "api: marks tests as API tests",
]

# Test discovery patterns
norecursedirs = [
    ".*",
    "build",
    "dist",
    "CVS",
    "_darcs",
    "{arch}",
    "*.egg",
    "venv",
    "env",
    "node_modules",
]

# Coverage options
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

# Ruff linter configuration
[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# F821: undefined name (catches missing imports like the func.now() bug)
# F401: unused imports
# F811: redefined unused name
# F841: unused variables
select = ["F821", "F401", "F811", "F841"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py files
"__init__.py" = ["F401"]
# Allow unused imports in conftest (fixtures)
"tests/conftest.py" = ["F401"]
