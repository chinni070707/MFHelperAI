            expense: '💸'
        };
        
        function FinancialPlanner() {
            // State
            const [currentAge, setCurrentAge] = useState(30);
            const [currentNetworth, setCurrentNetworth] = useState(3000000);
            const [growthRate, setGrowthRate] = useState(8);
            const [inflationRate, setInflationRate] = useState(6);
            const [retirementAge, setRetirementAge] = useState(60);
            const [retirementExpense, setRetirementExpense] = useState(100000);
            const [lifeEndAge, setLifeEndAge] = useState(80);
            const [goals, setGoals] = useState([]);
            const [sips, setSips] = useState([]);
            const [lumpsums, setLumpsums] = useState([]);
            const [showGoalPopup, setShowGoalPopup] = useState(false);
            const [clickedAge, setClickedAge] = useState(null);
            const [popupPosition, setPopupPosition] = useState({ x: 0, y: 0 });
            const [scenario, setScenario] = useState('medium');
            const [draggedTemplate, setDraggedTemplate] = useState(null);
            const [dropAge, setDropAge] = useState(null);
            const [isDraggingOver, setIsDraggingOver] = useState(false);
            
            // Input Modal State
            const [inputModal, setInputModal] = useState({
                show: false,
                title: '',
                fields: [],
                onSubmit: null,
                onCancel: null
            });
            
            // Show input modal helper
            const showInputModal = (config) => {
                setInputModal({
                    show: true,
                    title: config.title || 'Enter Details',
                    fields: config.fields || [],
                    onSubmit: config.onSubmit,
                    onCancel: config.onCancel || (() => setInputModal(prev => ({...prev, show: false})))
                });
            };
            
            const closeInputModal = () => {
                setInputModal(prev => ({...prev, show: false}));
            };
            
            // Confirm Modal State
            const [confirmModal, setConfirmModal] = useState({
                show: false,
                title: '',
                message: '',
                onConfirm: null,
                onCancel: null
            });
            
            const showConfirmModal = (config) => {
                setConfirmModal({
                    show: true,
                    title: config.title || 'Confirm',
                    message: config.message || 'Are you sure?',
                    onConfirm: config.onConfirm,
                    onCancel: config.onCancel || (() => setConfirmModal(prev => ({...prev, show: false})))
                });
            };
            
            const closeConfirmModal = () => {
                setConfirmModal(prev => ({...prev, show: false}));
            };
            
            const svgRef = useRef(null);
            const containerRef = useRef(null);
            
            // Chart dimensions
            const width = 900;
            const height = 500;
            const margin = { top: 40, right: 40, bottom: 60, left: 80 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;
            
            // Get scenario-based growth rate
            const getScenarioGrowthRate = () => {
                if (scenario === 'optimistic') return 14;
                if (scenario === 'pessimistic') return 8;
                return 12; // medium
            };
            
            // Calculate wealth projection
            const calculateProjection = () => {
                const projection = [];
                let wealth = currentNetworth;
                const effectiveGrowthRate = getScenarioGrowthRate();
                
                for (let age = currentAge; age <= lifeEndAge; age++) {
                    // Apply growth
                    wealth = wealth * (1 + effectiveGrowthRate / 100);
                    
                    // Add SIPs
                    sips.forEach(sip => {
                        if (age >= sip.startAge && age <= sip.endAge) {
                            wealth += sip.amount * 12;
                        }
                    });
                    
                    // Add lumpsums
                    lumpsums.forEach(lump => {
                        if (age === lump.age) {
                            wealth += lump.amount;
                        }
                    });
                    
                    // Subtract goals
                    goals.forEach(goal => {
                        if (age === goal.age) {
                            wealth -= goal.amount;
                        }
                    });
                    
                    // Post-retirement withdrawals
                    if (age >= retirementAge) {
                        const yearlyExpense = retirementExpense * 12;
                        wealth -= yearlyExpense * Math.pow(1 + inflationRate / 100, age - retirementAge);
                    }
                    
                    projection.push({ age, wealth: Math.max(0, wealth) });
                    
                    if (wealth <= 0) break;
                }
                
                return projection;
            };
            
            const projection = calculateProjection();
            const peakWealth = Math.max(...projection.map(p => p.wealth));
            const wealthAtRetirement = projection.find(p => p.age === retirementAge)?.wealth || 0;
            const moneyRunsOutAge = projection.find(p => p.wealth <= 0)?.age || (projection.length > 0 ? projection[projection.length - 1].age : lifeEndAge);
            
            // Format currency
            const formatCurrency = (amount) => {
                if (amount >= 10000000) return `₹${(amount / 10000000).toFixed(2)} Cr`;
                if (amount >= 100000) return `₹${(amount / 100000).toFixed(2)} L`;
                if (amount >= 1000) return `₹${(amount / 1000).toFixed(2)} K`;
                return `₹${amount.toLocaleString('en-IN')}`;
            };
            
            // D3 Visualization
            useEffect(() => {
                if (!svgRef.current || projection.length === 0) return;
                
                const svg = d3.select(svgRef.current);
                svg.selectAll('*').remove();
                
                // Scales
                const xScale = d3.scaleLinear()
                    .domain([currentAge, lifeEndAge])
                    .range([0, innerWidth]);
                
                const maxWealth = Math.max(peakWealth, currentNetworth * 2);
                const yScale = d3.scaleLinear()
                    .domain([0, maxWealth])
                    .range([innerHeight, 0]);
                
                const g = svg.append('g')
                    .attr('transform', `translate(${margin.left},${margin.top})`);
                
                // Add invisible rectangle for click detection
                g.append('rect')
                    .attr('width', innerWidth)
                    .attr('height', innerHeight)
                    .attr('fill', 'transparent')
                    .style('cursor', 'crosshair')
                    .on('mousemove', function(event) {
                        const [mouseX] = d3.pointer(event);
                        const age = Math.round(xScale.invert(mouseX));
                        
                        if (age >= currentAge && age <= lifeEndAge) {
                            // Remove old hover line
                            g.selectAll('.hover-line').remove();
                            
                            // Add hover line
                            g.append('line')
                                .attr('class', 'hover-line')
                                .attr('x1', xScale(age))
                                .attr('x2', xScale(age))
                                .attr('y1', 0)
                                .attr('y2', innerHeight)
                                .attr('stroke', '#3b82f6')
                                .attr('stroke-width', 1)
                                .attr('stroke-dasharray', '4,4')
                                .attr('opacity', 0.5);
                            
                            // Add age label
                            g.append('text')
                                .attr('class', 'hover-line')
                                .attr('x', xScale(age))
                                .attr('y', -5)
                                .attr('text-anchor', 'middle')
                                .attr('fill', '#3b82f6')
                                .attr('font-size', '14px')
                                .attr('font-weight', 'bold')
                                .text(`Age ${age}`);
                        }
                    })
                    .on('mouseout', function() {
                        g.selectAll('.hover-line').remove();
                    })
                    .on('click', function(event) {
                        const [mouseX, mouseY] = d3.pointer(event);
                        const age = Math.round(xScale.invert(mouseX));
                        const wealth = yScale.invert(mouseY);
                        
                        if (age >= currentAge && age <= lifeEndAge) {
                            // Get position relative to container
                            const svgRect = svgRef.current.getBoundingClientRect();
                            const containerRect = containerRef.current.getBoundingClientRect();
                            const clickX = event.clientX - containerRect.left;
                            const clickY = event.clientY - containerRect.top;
                            
                            setClickedAge(age);
                            setPopupPosition({ x: clickX, y: clickY });
                            setShowGoalPopup(true);
                        }
                    });
                
                // Gradient
                const gradient = svg.append('defs')
                    .append('linearGradient')
                    .attr('id', 'wealthGradient')
                    .attr('x1', '0%')
                    .attr('y1', '0%')
                    .attr('x2', '0%')
                    .attr('y2', '100%');
                
                gradient.append('stop')
                    .attr('offset', '0%')
                    .attr('stop-color', '#7FC04C')
                    .attr('stop-opacity', 0.6);
                
                gradient.append('stop')
                    .attr('offset', '100%')
                    .attr('stop-color', '#7FC04C')
                    .attr('stop-opacity', 0.1);
                
                // Grid lines
                const yTicks = yScale.ticks(8);
                g.selectAll('.grid-line')
                    .data(yTicks)
                    .enter()
                    .append('line')
                    .attr('class', 'grid-line')
                    .attr('x1', 0)
                    .attr('x2', innerWidth)
                    .attr('y1', d => yScale(d))
                    .attr('y2', d => yScale(d));
                
                // Retirement line
                g.append('line')
                    .attr('x1', xScale(retirementAge))
                    .attr('x2', xScale(retirementAge))
                    .attr('y1', 0)
                    .attr('y2', innerHeight)
                    .attr('stroke', '#f59e0b')
                    .attr('stroke-width', 2)
                    .attr('stroke-dasharray', '8,4');
                
                g.append('text')
                    .attr('x', xScale(retirementAge))
                    .attr('y', -10)
                    .attr('text-anchor', 'middle')
                    .attr('fill', '#f59e0b')
                    .attr('font-weight', 'bold')
                    .attr('font-size', '12px')
                    .text(`🏖️ Retirement ${retirementAge}`);
                
                // Drop indicator line (when dragging)
                if (dropAge && draggedTemplate) {
                    g.append('line')
                        .attr('class', 'drop-indicator-line')
                        .attr('x1', xScale(dropAge))
                        .attr('x2', xScale(dropAge))
                        .attr('y1', 0)
                        .attr('y2', innerHeight)
                        .attr('stroke', '#3b82f6')
                        .attr('stroke-width', 3)
                        .attr('stroke-dasharray', '10,5')
                        .style('filter', 'drop-shadow(0 0 8px #3b82f6)');
                    
                    g.append('text')
                        .attr('class', 'drop-indicator-line')
                        .attr('x', xScale(dropAge))
                        .attr('y', -25)
                        .attr('text-anchor', 'middle')
                        .attr('fill', '#3b82f6')
                        .attr('font-weight', 'bold')
                        .attr('font-size', '14px')
                        .text(`Drop at Age ${dropAge}`);
                    
                    g.append('text')
                        .attr('class', 'drop-indicator-line')
                        .attr('x', xScale(dropAge))
                        .attr('y', innerHeight / 2)
                        .attr('text-anchor', 'middle')
                        .attr('font-size', '48px')
                        .text(iconTypeToEmoji[draggedTemplate.iconType] || '⭐')
                        .style('opacity', 0.6);
                }
                
                // Area under curve
                const area = d3.area()
                    .x(d => xScale(d.age))
                    .y0(innerHeight)
                    .y1(d => yScale(d.wealth))
                    .curve(d3.curveMonotoneX);
                
                g.append('path')
                    .datum(projection)
                    .attr('class', 'wealth-area')
                    .attr('d', area);
                
                // Wealth curve
                const line = d3.line()
                    .x(d => xScale(d.age))
                    .y(d => yScale(d.wealth))
                    .curve(d3.curveMonotoneX);
                
                g.append('path')
                    .datum(projection)
                    .attr('class', 'wealth-curve')
                    .attr('d', line);
                
                // X Axis
                const xAxis = d3.axisBottom(xScale)
                    .ticks(10)
                    .tickFormat(d => d);
                
                g.append('g')
                    .attr('transform', `translate(0,${innerHeight})`)
                    .call(xAxis)
                    .attr('color', 'rgba(0,0,0,0.5)');
                
                g.append('text')
                    .attr('x', innerWidth / 2)
                    .attr('y', innerHeight + 45)
                    .attr('text-anchor', 'middle')
                    .attr('fill', '#495057')
                    .attr('font-weight', 'bold')
                    .text('Age (Years)');
                
                // Y Axis
                const yAxis = d3.axisLeft(yScale)
                    .ticks(8)
                    .tickFormat(d => formatCurrency(d));
                
                g.append('g')
                    .call(yAxis)
                    .attr('color', 'rgba(0,0,0,0.5)');
                
                g.append('text')
                    .attr('transform', 'rotate(-90)')
                    .attr('x', -innerHeight / 2)
                    .attr('y', -60)
                    .attr('text-anchor', 'middle')
                    .attr('fill', '#495057')
                    .attr('font-weight', 'bold')
                    .text('Net Worth');
                
                // Goal markers
                goals.forEach((goal) => {
                    const goalData = projection.find(p => p.age === goal.age);
                    if (!goalData) return;
                    
                    const goalG = g.append('g')
                        .attr('class', 'goal-marker')
                        .attr('transform', `translate(${xScale(goal.age)},${yScale(goalData.wealth)})`)
                        .style('cursor', 'grab');
                    
                    goalG.append('circle')
                        .attr('r', 24)
                        .attr('fill', 'rgba(247, 37, 133, 0.9)')
                        .attr('stroke', 'white')
                        .attr('stroke-width', 3);
                    
                    goalG.append('text')
                        .attr('text-anchor', 'middle')
                        .attr('dy', '0.35em')
                        .attr('font-size', '20px')
                        .text(iconTypeToEmoji[goal.iconType] || '⭐');
                    
                    goalG.append('title')
                        .text(`${goal.name}\n${formatCurrency(goal.amount)}\nAge ${goal.age}`);
                });
                
            }, [projection, goals, retirementAge, currentAge, lifeEndAge, dropAge, draggedTemplate]);
            
            // Keyboard shortcuts
            useEffect(() => {
                const handleKeyPress = (e) => {
                    if (e.key === 'Escape' && showGoalPopup) {
                        setShowGoalPopup(false);
                    }
                };
                
                window.addEventListener('keydown', handleKeyPress);
                return () => window.removeEventListener('keydown', handleKeyPress);
            }, [showGoalPopup]);
            
            const goalTemplates = [
                { iconType: 'house', name: 'House Purchase', defaultAmount: 5000000 },
                { iconType: 'vehicle', name: 'Vehicle', defaultAmount: 1000000 },
                { iconType: 'education', name: 'Education', defaultAmount: 2500000 },
                { iconType: 'marriage', name: 'Marriage', defaultAmount: 1500000 },
                { iconType: 'vacation', name: 'Vacation', defaultAmount: 500000 },
                { iconType: 'business', name: 'Business', defaultAmount: 5000000 },
                { iconType: 'emergency', name: 'Emergency', defaultAmount: 1000000 },
                { iconType: 'custom', name: 'Custom', defaultAmount: 1000000 }
            ];
            
            const addGoalFromPopup = (template, amount) => {
                if (!amount || amount <= 0 || !clickedAge) return;
                
                setGoals([...goals, {
                    iconType: template.iconType,
                    name: template.name,
                    amount: parseFloat(amount),
                    age: clickedAge
                }]);
                
                setShowGoalPopup(false);
                setClickedAge(null);
            };
            
            const addIncome = (amount) => {
                if (!amount || amount <= 0 || !clickedAge) return;
                
                setLumpsums([...lumpsums, { amount: parseFloat(amount), age: clickedAge }]);
                setShowGoalPopup(false);
                setClickedAge(null);
            };
            
            const addExpense = (amount, name = 'Expense') => {
                if (!amount || amount <= 0 || !clickedAge) return;
                
                setGoals([...goals, {
                    iconType: 'expense',
                    name: name,
                    amount: parseFloat(amount),
                    age: clickedAge
                }]);
                
                setShowGoalPopup(false);
                setClickedAge(null);
            };
            
            const deleteGoal = (index) => {
                showConfirmModal({
                    title: '🗑️ Delete Goal',
                    message: 'Are you sure you want to delete this goal?',
                    onConfirm: () => {
                        setGoals(goals.filter((_, i) => i !== index));
                    }
                });
            };
            
            // Drag and drop handlers
            const handleDragStart = (template) => {
                setDraggedTemplate(template);
            };
            
            const handleDragEnd = () => {
                setDraggedTemplate(null);
                setDropAge(null);
                setIsDraggingOver(false);
            };
            
            const handleDragOver = (e, age) => {
                e.preventDefault();
                setDropAge(age);
                setIsDraggingOver(true);
            };
            
            const handleDragLeave = () => {
                setIsDraggingOver(false);
            };
            
            const handleDrop = (e, age) => {
                e.preventDefault();
                setIsDraggingOver(false);
                
                if (!draggedTemplate || !age) return;
                
                // Show input modal for amount
                const template = draggedTemplate;
                showInputModal({
                    title: `🎯 Add ${template.name} at Age ${age}`,
                    fields: [
                        {
                            name: 'amount',
                            label: 'Amount (₹)',
                            type: 'number',
                            defaultValue: template.defaultAmount,
                            placeholder: 'Enter amount'
                        }
                    ],
                    onSubmit: (values) => {
                        const amount = parseFloat(values.amount);
                        if (amount && amount > 0) {
                            const newGoal = {
                                iconType: template.iconType,
                                name: template.name,
                                amount: amount,
                                age: age
                            };
                            setGoals([...goals, newGoal]);
                        }
                        setDraggedTemplate(null);
                        setDropAge(null);
                    }
                });
            };
            
            const addSIP = () => {
                showInputModal({
                    title: '📈 Add Monthly SIP',
                    fields: [
                        {
                            name: 'amount',
                            label: 'Monthly SIP Amount (₹)',
                            type: 'number',
                            defaultValue: '10000',
                            placeholder: 'Enter monthly amount'
                        },
                        {
                            name: 'startAge',
                            label: 'Start Age',
                            type: 'number',
                            defaultValue: currentAge.toString(),
                            placeholder: 'Age to start SIP'
                        },
                        {
                            name: 'endAge',
                            label: 'End Age',
                            type: 'number',
                            defaultValue: retirementAge.toString(),
                            placeholder: 'Age to end SIP'
                        }
                    ],
                    onSubmit: (values) => {
                        const amount = parseFloat(values.amount);
                        const startAge = parseInt(values.startAge);
                        const endAge = parseInt(values.endAge);
                        
                        if (amount && startAge && endAge && endAge > startAge) {
                            setSips([...sips, { amount, startAge, endAge }]);
                        }
                    }
                });
            };
            
            const addLumpsum = () => {
                showInputModal({
                    title: '💰 Add Lumpsum Investment',
                    fields: [
                        {
                            name: 'amount',
                            label: 'Lumpsum Amount (₹)',
                            type: 'number',
                            defaultValue: '500000',
                            placeholder: 'Enter lumpsum amount'
                        },
                        {
                            name: 'age',
                            label: 'Investment Age',
                            type: 'number',
                            defaultValue: (currentAge + 5).toString(),
                            placeholder: 'Age when you will invest'
                        }
                    ],
                    onSubmit: (values) => {
                        const amount = parseFloat(values.amount);
                        const age = parseInt(values.age);
                        
                        if (amount && age && age > currentAge) {
                            setLumpsums([...lumpsums, { amount, age }]);
                        }
                    }
                });
            };
            
            return (
                <div className="min-h-screen p-6">
                    <div className="max-w-7xl mx-auto">
                        {/* Header */}
                        <div className="glass-card mb-6 flex justify-between items-center">
                            <h1 className="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-600 bg-clip-text text-transparent">
                                💰 Your Financial Life Journey
                            </h1>
                            <a href="/" className="btn-secondary" style={{width: 'auto', padding: '10px 20px'}}>
                                ← Back
                            </a>
                        </div>
                        
                        <p className="text-center text-lg text-gray-300 mb-8">
                            Click anywhere on the timeline to add goals, income, or expenses!
                        </p>
                        
                        {/* Goal Popup */}
                        {showGoalPopup && (
                            <div 
                                style={{
                                    position: 'fixed',
                                    top: 0,
                                    left: 0,
                                    right: 0,
                                    bottom: 0,
                                    background: 'rgba(0,0,0,0.7)',
                                    backdropFilter: 'blur(5px)',
                                    zIndex: 9999,
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center'
                                }}
                                onClick={() => setShowGoalPopup(false)}
                            >
                                <div 
                                    className="glass-card"
                                    style={{
                                        maxWidth: '600px',
                                        width: '90%',
                                        maxHeight: '80vh',
                                        overflowY: 'auto'
                                    }}
                                    onClick={(e) => e.stopPropagation()}
                                >
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-2xl font-bold text-green-600">
                                            Add Event at Age {clickedAge}
                                        </h3>
                                        <button 
                                            onClick={() => setShowGoalPopup(false)}
                                            className="text-white text-3xl hover:text-red-400 transition-colors"
                                            style={{background: 'none', border: 'none', cursor: 'pointer'}}
                                        >
                                            ×
                                        </button>
                                    </div>
                                    
                                    {/* Goal Templates */}
                                    <div className="mb-6">
                                        <h4 className="text-lg font-semibold mb-3 text-gray-300">🎯 Life Goals</h4>
                                        <div className="grid grid-cols-4 gap-3 mb-4">
                                            {goalTemplates.map((template, index) => (
                                                <div
                                                    key={index}
                                                    className="goal-card"
                                                    onClick={() => {
                                                        showInputModal({
                                                            title: `🎯 Add ${template.name}`,
                                                            fields: [{
                                                                name: 'amount',
                                                                label: 'Amount (₹)',
                                                                type: 'number',
                                                                defaultValue: template.defaultAmount,
                                                                placeholder: 'Enter amount'
                                                            }],
                                                            onSubmit: (values) => {
                                                                if (values.amount) addGoalFromPopup(template, values.amount);
                                                            }
                                                        });
                                                    }}
                                                >
                                                    <div className="mb-1 flex justify-center"><GoalIcon iconType={template.iconType} size={20} /></div>
                                                    <div className="text-xs font-semibold">{template.name}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    {/* Quick Income/Expense */}
                                    <div className="grid grid-cols-2 gap-4 mb-4">
                                        <div>
                                            <h4 className="text-lg font-semibold mb-3 text-green-400">💰 Add Income</h4>
                                            <button
                                                className="btn-primary"
                                                style={{background: 'linear-gradient(135deg, #10b981, #059669)'}}
                                                onClick={() => {
                                                    showInputModal({
                                                        title: '💰 Add Income',
                                                        fields: [{
                                                            name: 'amount',
                                                            label: 'Income/Lumpsum Amount (₹)',
                                                            type: 'number',
                                                            defaultValue: '500000',
                                                            placeholder: 'Enter income amount'
                                                        }],
                                                        onSubmit: (values) => {
                                                            if (values.amount) addIncome(values.amount);
                                                        }
                                                    });
                                                }}
                                            >
                                                Add Lumpsum Income
                                            </button>
                                        </div>
                                        <div>
                                            <h4 className="text-lg font-semibold mb-3 text-red-400">💸 Add Expense</h4>
                                            <button
                                                className="btn-primary"
                                                style={{background: 'linear-gradient(135deg, #ef4444, #dc2626)'}}
                                                onClick={() => {
                                                    showInputModal({
                                                        title: '💸 Add Expense',
                                                        fields: [
                                                            {
                                                                name: 'name',
                                                                label: 'Expense Name',
                                                                type: 'text',
                                                                defaultValue: 'Other Expense',
                                                                placeholder: 'Enter expense name'
                                                            },
                                                            {
                                                                name: 'amount',
                                                                label: 'Amount (₹)',
                                                                type: 'number',
                                                                defaultValue: '100000',
                                                                placeholder: 'Enter amount'
                                                            }
                                                        ],
                                                        onSubmit: (values) => {
                                                            if (values.name && values.amount) {
                                                                addExpense(values.amount, values.name);
                                                            }
                                                        }
                                                    });
                                                }}
                                            >
                                                Add One-time Expense
                                            </button>
                                        </div>
                                    </div>
                                    
                                    <div className="text-center text-sm text-gray-400 mt-4">
                                        Click outside to close or press Escape
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {/* Summary Cards - At Top */}
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                            <div className="stat-card">
                                <div className="text-sm text-gray-400 mb-2">Retirement Corpus (Age {retirementAge})</div>
                                <div className="text-2xl font-bold text-green-400">{formatCurrency(wealthAtRetirement)}</div>
                            </div>
                            <div className="stat-card">
                                <div className="text-sm text-gray-400 mb-2">Funds Available Till</div>
                                <div className="text-2xl font-bold text-green-600">
                                    {moneyRunsOutAge >= lifeEndAge ? `Age ${lifeEndAge}+` : `Age ${moneyRunsOutAge}`}
                                </div>
                            </div>
                            <div className="stat-card">
                                <div className="text-sm text-gray-400 mb-2">Peak Wealth</div>
                                <div className="text-2xl font-bold text-purple-400">{formatCurrency(peakWealth)}</div>
                            </div>
                            <div className="stat-card">
                                <div className="text-sm text-gray-400 mb-2">Total Goals</div>
                                <div className="text-2xl font-bold text-pink-400">{goals.length}</div>
                                <div className="text-xs text-gray-500 mt-1">
                                    {formatCurrency(goals.reduce((sum, g) => sum + g.amount, 0))}
                                </div>
                            </div>
                        </div>
                        
                        {/* Chart and Goals Side by Side */}
                        <div className="flex gap-4 mb-6">
                            {/* Main Chart Area - 3/4 width */}
                            <div className="glass-card" style={{flex: '3'}}>
                                <div className="flex justify-between items-center mb-4">
                                    <div>
                                        <h3 className="text-xl font-bold text-green-600">📈 Your Wealth Growth Timeline</h3>
                                        <p className="text-sm text-gray-400 mt-1">👆 Click on the chart at any age to add events</p>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        {/* Scenario Buttons */}
                                        <div className="flex gap-2">
                                            <button
                                            className={`px-3 py-1 rounded-lg text-sm font-semibold transition-all ${
                                                scenario === 'optimistic' 
                                                    ? 'bg-green-500 text-white' 
                                                    : 'bg-white bg-opacity-10 text-gray-300 hover:bg-opacity-20'
                                            }`}
                                            onClick={() => setScenario('optimistic')}
                                        >
                                            Optimistic (14%)
                                        </button>
                                        <button
                                            className={`px-3 py-1 rounded-lg text-sm font-semibold transition-all ${
                                                scenario === 'medium' 
                                                    ? 'bg-blue-500 text-white' 
                                                    : 'bg-white bg-opacity-10 text-gray-300 hover:bg-opacity-20'
                                            }`}
                                            onClick={() => setScenario('medium')}
                                        >
                                            Medium (12%)
                                        </button>
                                        <button
                                            className={`px-3 py-1 rounded-lg text-sm font-semibold transition-all ${
                                                scenario === 'pessimistic' 
                                                    ? 'bg-red-500 text-white' 
                                                    : 'bg-white bg-opacity-10 text-gray-300 hover:bg-opacity-20'
                                            }`}
                                            onClick={() => setScenario('pessimistic')}
                                        >
                                            Pessimistic (8%)
                                        </button>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <label className="text-sm whitespace-nowrap">Life End Age:</label>
                                        <input 
                                            type="number" 
                                            value={lifeEndAge} 
                                            onChange={e => setLifeEndAge(parseInt(e.target.value))} 
                                            min={retirementAge + 10}
                                            max="120"
                                            className="w-20 px-2 py-1"
                                            style={{fontSize: '14px', padding: '6px 10px'}}
                                        />
                                    </div>
                                </div>
                            </div>
                            <div 
                                ref={containerRef} 
                                className={`overflow-x-auto drop-zone ${isDraggingOver ? 'drag-over' : ''}`}
                                style={{position: 'relative'}}
                                onDragOver={(e) => {
                                    e.preventDefault();
                                    if (!draggedTemplate) return;
                                    const rect = e.currentTarget.getBoundingClientRect();
                                    const x = e.clientX - rect.left - margin.left;
                                    const xScale = d3.scaleLinear()
                                        .domain([currentAge, lifeEndAge])
                                        .range([0, innerWidth]);
                                    const age = Math.round(xScale.invert(x));
                                    if (age >= currentAge && age <= lifeEndAge) {
                                        handleDragOver(e, age);
                                    }
                                }}
                                onDragLeave={handleDragLeave}
                                onDrop={(e) => {
                                    if (!dropAge) return;
                                    handleDrop(e, dropAge);
                                }}
                            >
                                <svg ref={svgRef} width={width} height={height} className="mx-auto" />
                                {draggedTemplate && dropAge && (
                                    <div 
                                        className="goal-ghost"
                                        style={{
                                            position: 'absolute',
                                            left: `${margin.left + (dropAge - currentAge) / (lifeEndAge - currentAge) * innerWidth}px`,
                                            top: '50%',
                                            transform: 'translate(-50%, -50%)'
                                        }}
                                    >
                                        <GoalIcon iconType={draggedTemplate.iconType} size={32} />
                                    </div>
                                )}
                            </div>
                        </div>
                        
                            {/* Goal Templates - 1/4 width */}
                            <div className="glass-card" style={{flex: '1', minWidth: '250px'}}>
                                <h3 className="text-lg font-bold mb-2 text-green-600">🎯 Drag & Drop Goals</h3>
                                <p className="text-gray-300 mb-3 text-sm">
                                    Drag any goal icon and drop it on the chart!
                                </p>
                                <div className="grid grid-cols-2 gap-2">
                                {goalTemplates.map((template, index) => (
                                    <div
                                        key={index}
                                        className={`goal-card ${draggedTemplate?.name === template.name ? 'dragging' : ''}`}
                                        draggable="true"
                                        onDragStart={() => handleDragStart(template)}
                                        onDragEnd={handleDragEnd}
                                        onClick={() => {
                                            showInputModal({
                                                title: `🎯 Add ${template.name}`,
                                                fields: [
                                                    {
                                                        name: 'age',
                                                        label: 'Target Age',
                                                        type: 'number',
                                                        defaultValue: (currentAge + 5).toString(),
                                                        placeholder: 'Enter target age'
                                                    },
                                                    {
                                                        name: 'amount',
                                                        label: 'Amount (₹)',
                                                        type: 'number',
                                                        defaultValue: template.defaultAmount,
                                                        placeholder: 'Enter amount'
                                                    }
                                                ],
                                                onSubmit: (values) => {
                                                    const age = parseInt(values.age);
                                                    const amount = parseFloat(values.amount);
                                                    if (age && age > currentAge && amount) {
                                                        setGoals([...goals, {
                                                            iconType: template.iconType,
                                                            name: template.name,
                                                            amount: amount,
                                                            age: age
                                                        }]);
                                                    }
                                                }
                                            });
                                        }}
                                    >
                                        <div className="mb-2 flex justify-center"><GoalIcon iconType={template.iconType} size={24} /></div>
                                        <div className="text-xs font-semibold">{template.name}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        </div>
                        
                        {/* Detailed Controls and Goals List */}
                        <div className="footer-controls grid grid-cols-1 lg:grid-cols-3 gap-3">
                            {/* Controls */}
                            <div className="space-y-3">
                                {/* Basic Info */}
                                <div className="glass-card">
                                    <h3 className="text-xl font-bold mb-4 text-green-600">📊 Basic Information</h3>
                                    <div className="space-y-2">
                                        <div>
                                            <label>Current Age</label>
                                            <input type="number" value={currentAge} onChange={e => setCurrentAge(parseInt(e.target.value))} min="18" max="80" />
                                        </div>
                                        <div>
                                            <label>Current Net Worth (₹)</label>
                                            <input type="number" value={currentNetworth} onChange={e => setCurrentNetworth(parseFloat(e.target.value))} step="100000" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label>Growth Rate (Scenario)</label>
                                                <div className="px-4 py-3 rounded-lg bg-white bg-opacity-10 text-center">
                                                    <span className="text-xl font-bold text-green-600">{getScenarioGrowthRate()}%</span>
                                                    <div className="text-xs text-gray-400 mt-1 capitalize">{scenario}</div>
                                                </div>
                                            </div>
                                            <div>
                                                <label>Inflation (%)</label>
                                                <input type="number" value={inflationRate} onChange={e => setInflationRate(parseFloat(e.target.value))} step="0.5" />
                                            </div>
                                        </div>
                                        <div>
                                            <label>Retirement Age</label>
                                            <input type="number" value={retirementAge} onChange={e => setRetirementAge(parseInt(e.target.value))} min="40" max="80" />
                                        </div>
                                        <div>
                                            <label>Monthly Expense Post-Retirement (₹)</label>
                                            <input type="number" value={retirementExpense} onChange={e => setRetirementExpense(parseFloat(e.target.value))} step="10000" />
                                        </div>
                                    </div>
                                </div>
                                
                                {/* Add Investment */}
                                <div className="glass-card">
                                    <h3 className="text-xl font-bold mb-4 text-green-600">💼 Add Investment</h3>
                                    <div className="space-y-2">
                                        <button onClick={addSIP} className="btn-primary">
                                            📈 Add SIP
                                        </button>
                                        <button onClick={addLumpsum} className="btn-secondary">
                                            ➕ Add Lumpsum
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            {/* Goals List and Investments */}
                            <div className="lg:col-span-2 space-y-3">
                                {/* Goals List */}
                                {goals.length > 0 && (
                                    <div className="glass-card">
                                        <h3 className="text-xl font-bold mb-4 text-green-600">📋 Planned Goals</h3>
                                        <div className="space-y-3">
                                            {goals.map((goal, index) => (
                                                <div key={index} className="flex items-center justify-between p-3 bg-white bg-opacity-5 rounded-lg">
                                                    <div className="flex items-center gap-3">
                                                        <GoalIcon iconType={goal.iconType} size={24} />
                                                        <div>
                                                            <div className="font-semibold">{goal.name}</div>
                                                            <div className="text-sm text-gray-400">Age {goal.age} • {formatCurrency(goal.amount)}</div>
                                                        </div>
                                                    </div>
                                                    <button
                                                        onClick={() => deleteGoal(index)}
                                                        className="text-red-400 hover:text-red-300 px-3 py-1 rounded"
                                                    >
                                                        🗑️
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                
                                {/* SIP List */}
                                {sips.length > 0 && (
                                    <div className="glass-card">
                                        <h3 className="text-xl font-bold mb-4 text-green-600">📈 Active SIPs</h3>
                                        <div className="space-y-3">
                                            {sips.map((sip, index) => (
                                                <div key={index} className="flex items-center justify-between p-3 bg-white bg-opacity-5 rounded-lg">
                                                    <div>
                                                        <div className="font-semibold">{formatCurrency(sip.amount)}/month</div>
                                                        <div className="text-sm text-gray-400">Age {sip.startAge} to {sip.endAge}</div>
                                                    </div>
                                                    <button
                                                        onClick={() => setSips(sips.filter((_, i) => i !== index))}
                                                        className="text-red-400 hover:text-red-300 px-3 py-1 rounded"
                                                    >
                                                        🗑️
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                
                                {/* Lumpsum List */}
                                {lumpsums.length > 0 && (
                                    <div className="glass-card">
                                        <h3 className="text-xl font-bold mb-4 text-green-600">➕ Lumpsum Investments</h3>
                                        <div className="space-y-3">
                                            {lumpsums.map((lump, index) => (
                                                <div key={index} className="flex items-center justify-between p-3 bg-white bg-opacity-5 rounded-lg">
                                                    <div>
                                                        <div className="font-semibold">{formatCurrency(lump.amount)}</div>
                                                        <div className="text-sm text-gray-400">At Age {lump.age}</div>
                                                    </div>
                                                    <button
                                                        onClick={() => setLumpsums(lumpsums.filter((_, i) => i !== index))}
                                                        className="text-red-400 hover:text-red-300 px-3 py-1 rounded"
                                                    >
                                                        🗑️
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                    
                    {/* Custom Input Modal */}
                    {inputModal.show && (
                        <div 
                            style={{
                                position: 'fixed',
                                top: 0,
                                left: 0,
                                right: 0,
                                bottom: 0,
                                background: 'rgba(0,0,0,0.7)',
                                backdropFilter: 'blur(5px)',
                                zIndex: 10000,
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center'
                            }}
                            onClick={closeInputModal}
                        >
                            <div 
                                className="glass-card"
                                style={{
                                    maxWidth: '450px',
                                    width: '90%',
                                    animation: 'scaleIn 0.2s ease-out'
                                }}
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-bold text-green-400">
                                        {inputModal.title}
                                    </h3>
                                    <button 
                                        onClick={closeInputModal}
                                        className="text-white text-2xl hover:text-red-400 transition-colors"
                                        style={{background: 'none', border: 'none', cursor: 'pointer'}}
                                    >
                                        ×
                                    </button>
                                </div>
                                
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const formData = new FormData(e.target);
                                    const values = {};
                                    inputModal.fields.forEach(f => {
                                        values[f.name] = formData.get(f.name);
                                    });
                                    if (inputModal.onSubmit) inputModal.onSubmit(values);
                                    closeInputModal();
                                }}>
                                    {inputModal.fields.map((field, idx) => (
                                        <div key={idx} className="mb-4">
                                            <label className="block text-sm font-medium text-gray-300 mb-2">
                                                {field.label}
                                            </label>
                                            <input
                                                type={field.type || 'text'}
                                                name={field.name}
                                                defaultValue={field.defaultValue || ''}
                                                placeholder={field.placeholder || ''}
                                                required={field.required !== false}
                                                autoFocus={idx === 0}
                                                className="w-full px-4 py-3 rounded-lg bg-white bg-opacity-10 border border-gray-600 text-white focus:border-green-400 focus:outline-none transition-colors"
                                                style={{fontSize: '1rem'}}
                                            />
                                        </div>
                                    ))}
                                    
                                    <div className="flex gap-3 mt-6">
                                        <button
                                            type="button"
                                            onClick={closeInputModal}
                                            className="flex-1 px-4 py-3 rounded-lg bg-gray-600 hover:bg-gray-500 text-white font-semibold transition-colors"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="submit"
                                            className="flex-1 px-4 py-3 rounded-lg bg-green-600 hover:bg-green-500 text-white font-semibold transition-colors"
                                        >
                                            Confirm
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                    
                    {/* Custom Confirm Modal */}
                    {confirmModal.show && (
                        <div 
                            style={{
                                position: 'fixed',
                                top: 0,
                                left: 0,
                                right: 0,
                                bottom: 0,
                                background: 'rgba(0,0,0,0.7)',
                                backdropFilter: 'blur(5px)',
                                zIndex: 10000,
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center'
                            }}
                            onClick={closeConfirmModal}
                        >
                            <div 
                                className="glass-card"
                                style={{
                                    maxWidth: '400px',
                                    width: '90%',
                                    textAlign: 'center',
                                    animation: 'scaleIn 0.2s ease-out'
                                }}
                                onClick={(e) => e.stopPropagation()}
                            >
                                <h3 className="text-xl font-bold text-yellow-400 mb-4">
                                    {confirmModal.title}
                                </h3>
                                <p className="text-gray-300 mb-6">
                                    {confirmModal.message}
                                </p>
                                
                                <div className="flex gap-3">
                                    <button
                                        onClick={() => {
                                            closeConfirmModal();
                                            if (confirmModal.onCancel) confirmModal.onCancel();
                                        }}
                                        className="flex-1 px-4 py-3 rounded-lg bg-gray-600 hover:bg-gray-500 text-white font-semibold transition-colors"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={() => {
                                            closeConfirmModal();
                                            if (confirmModal.onConfirm) confirmModal.onConfirm();
                                        }}
                                        className="flex-1 px-4 py-3 rounded-lg bg-red-600 hover:bg-red-500 text-white font-semibold transition-colors"
                                    >
                                        Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        
        ReactDOM.render(<FinancialPlanner />, document.getElementById('root'));
    </script>
    
    <script>
        // Navbar toggle and scroll functions
        function toggleMenu() {
            const menu = document.querySelector('.nav-menu');
            menu.classList.toggle('active');
        }

        window.addEventListener('scroll', () => {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
    </script>
    
    <!-- Footer -->
    <div id="footer-placeholder"></div>
    <script src="/js/footer.js"></script>
</body>
</html>
