<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E67E22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="200" cy="130" r="200" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1000" cy="500" r="250" fill="rgba(255,255,255,0.05)"/>
  <!-- Venn diagram (overlap icon) -->
  <circle cx="550" cy="210" r="80" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="3"/>
  <circle cx="650" cy="210" r="80" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="3"/>
  <!-- Title -->
  <text x="600" y="365" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="white">Understanding</text>
  <text x="600" y="420" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="white">Portfolio Overlap</text>
  <!-- Subtitle -->
  <text x="600" y="480" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.85)">Is your diversification an illusion?</text>
  <!-- Brand -->
  <text x="600" y="580" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">MFHelper Blog</text>
</svg>
