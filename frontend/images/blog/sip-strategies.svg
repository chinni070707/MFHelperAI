<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8E44AD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6C3483;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="100" cy="530" r="200" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1100" cy="100" r="250" fill="rgba(255,255,255,0.05)"/>
  <!-- Chart icon (upward trend) -->
  <polyline points="500,280 550,240 600,260 650,200 700,170" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="700" cy="170" r="8" fill="white"/>
  <line x1="490" y1="290" x2="710" y2="290" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <line x1="490" y1="160" x2="490" y2="290" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <!-- Rocket -->
  <text x="730" y="180" font-size="40">&#x1F680;</text>
  <!-- Title -->
  <text x="600" y="370" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="white">Maximizing SIP Returns</text>
  <text x="600" y="425" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="white">5 Key Strategies</text>
  <!-- Subtitle -->
  <text x="600" y="485" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.85)">Achieve your financial goals faster</text>
  <!-- Brand -->
  <text x="600" y="580" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">MFHelper Blog</text>
</svg>
