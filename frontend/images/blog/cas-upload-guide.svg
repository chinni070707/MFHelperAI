<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C6BAC;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="150" cy="500" r="200" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1050" cy="130" r="250" fill="rgba(255,255,255,0.05)"/>
  <!-- Upload icon -->
  <rect x="540" y="140" width="120" height="140" rx="10" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="3"/>
  <polyline points="575,210 600,180 625,210" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="600" y1="185" x2="600" y2="250" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="560" y1="260" x2="640" y2="260" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <!-- Title -->
  <text x="600" y="360" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="white">Getting Started with</text>
  <text x="600" y="415" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="white">CAS Upload</text>
  <!-- Subtitle -->
  <text x="600" y="475" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.85)">Import your mutual fund portfolio in minutes</text>
  <!-- Brand -->
  <text x="600" y="580" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">MFHelper Blog</text>
</svg>
