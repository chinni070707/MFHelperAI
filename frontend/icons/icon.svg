<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#gradient)"/>
  
  <!-- Gradient -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- MF Text -->
  <text x="256" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="180" font-weight="bold" fill="white">MF</text>
  
  <!-- Growth Arrow Circle -->
  <circle cx="400" cy="130" r="70" fill="#22c55e"/>
  
  <!-- Checkmark/Arrow -->
  <path d="M370 130 L390 110 L430 160" stroke="white" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Chart bars at bottom -->
  <rect x="80" y="380" width="40" height="80" rx="8" fill="rgba(255,255,255,0.3)"/>
  <rect x="140" y="340" width="40" height="120" rx="8" fill="rgba(255,255,255,0.4)"/>
  <rect x="200" y="360" width="40" height="100" rx="8" fill="rgba(255,255,255,0.3)"/>
  <rect x="260" y="320" width="40" height="140" rx="8" fill="rgba(255,255,255,0.5)"/>
  <rect x="320" y="350" width="40" height="110" rx="8" fill="rgba(255,255,255,0.4)"/>
  <rect x="380" y="300" width="40" height="160" rx="8" fill="rgba(255,255,255,0.6)"/>
</svg>
