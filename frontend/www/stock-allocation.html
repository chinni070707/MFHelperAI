<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock-wise Allocation - MFHelper</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --dark-bg: #0f0f1e;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            padding: 10px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-primary);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(102, 126, 234, 0.2);
        }

        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .page-header .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .input-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
        }

        .fund-input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"], input[type="number"] {
            flex: 1;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .fund-list {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .fund-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fund-info {
            flex: 1;
        }

        .fund-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .fund-amount {
            color: #667eea;
            font-size: 0.9rem;
        }

        .remove-btn {
            background: rgba(255, 77, 79, 0.2);
            border: 1px solid rgba(255, 77, 79, 0.3);
            color: #ff4d4f;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .results-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 40px;
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .stock-grid {
            display: grid;
            gap: 15px;
        }

        .stock-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .stock-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        .stock-info {
            flex: 1;
        }

        .stock-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .fund-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .fund-tag {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.3);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        .stock-weight {
            text-align: right;
        }

        .weight-value {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
        }

        .weight-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .summary-value {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .summary-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🤖 MFHelper</div>
            <a href="/" class="back-btn">← Back to Home</a>
        </header>

        <div class="page-header">
            <div class="icon">📊</div>
            <h1>Stock-wise Allocation</h1>
            <p style="color: var(--text-secondary);">See which stocks are common across your mutual funds</p>
        </div>

        <div class="input-section">
            <h3 style="margin-bottom: 20px;">Add Your Mutual Funds</h3>
            <div class="fund-input-container">
                <input 
                    type="text" 
                    id="fundName" 
                    placeholder="Fund name (e.g., HDFC Top 100 Fund)"
                    style="flex: 2;"
                >
                <input 
                    type="number" 
                    id="fundAmount" 
                    placeholder="Amount (₹)"
                    style="flex: 1;"
                >
                <button class="btn btn-primary" onclick="addFund()">+ Add</button>
            </div>

            <div class="fund-list" id="fundList"></div>

            <div style="margin-top: 30px; text-align: center;">
                <button class="btn btn-primary" onclick="analyzeStocks()" style="padding: 15px 50px; font-size: 1.1rem;">
                    📊 Analyze Stock Allocation
                </button>
            </div>
        </div>

        <div class="results-section" id="resultsSection">
            <h2 style="margin-bottom: 30px;">📈 Your Stock Allocation</h2>
            
            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-value" id="totalStocks">0</div>
                    <div class="summary-label">Unique Stocks</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value" id="commonStocks">0</div>
                    <div class="summary-label">Common Stocks</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value" id="totalFunds">0</div>
                    <div class="summary-label">Mutual Funds</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value" id="topSectorValue">IT</div>
                    <div class="summary-label">Top Sector</div>
                </div>
            </div>

            <div class="chart-container">
                <h3 style="margin-bottom: 20px;">🏆 Top Stock Holdings</h3>
                <div class="stock-grid" id="stockGrid"></div>
            </div>

            <div style="background: rgba(102, 126, 234, 0.1); border: 1px solid rgba(102, 126, 234, 0.3); border-radius: 15px; padding: 25px;">
                <h3 style="margin-bottom: 15px;">💡 Insights</h3>
                <div id="insightsContent"></div>
            </div>
        </div>
    </div>

    <script>
        const funds = [];
        const API_BASE = 'http://localhost:8000/api';

        function addFund() {
            const nameInput = document.getElementById('fundName');
            const amountInput = document.getElementById('fundAmount');
            
            const name = nameInput.value.trim();
            const amount = parseFloat(amountInput.value);

            if (!name || !amount || amount <= 0) {
                alert('Please enter valid fund name and amount');
                return;
            }

            funds.push({ name, amount });
            nameInput.value = '';
            amountInput.value = '';
            renderFundList();
        }

        function removeFund(index) {
            funds.splice(index, 1);
            renderFundList();
        }

        function renderFundList() {
            const fundList = document.getElementById('fundList');
            if (funds.length === 0) {
                fundList.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 20px;">No funds added yet</p>';
                return;
            }

            fundList.innerHTML = funds.map((fund, index) => `
                <div class="fund-item">
                    <div class="fund-info">
                        <div class="fund-name">${fund.name}</div>
                        <div class="fund-amount">₹${fund.amount.toLocaleString('en-IN')}</div>
                    </div>
                    <button class="remove-btn" onclick="removeFund(${index})">Remove</button>
                </div>
            `).join('');
        }

        async function analyzeStocks() {
            if (funds.length === 0) {
                alert('Please add at least one fund');
                return;
            }

            const resultsSection = document.getElementById('resultsSection');
            const stockGrid = document.getElementById('stockGrid');
            
            resultsSection.classList.add('show');
            stockGrid.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Analyzing stock allocation across ${funds.length} funds...</p>
                </div>
            `;

            try {
                const response = await fetch(`${API_BASE}/analysis/stock-allocation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ funds })
                });

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                console.error('Error:', error);
                displayDemoResults();
            }
        }

        function displayDemoResults() {
            const totalAmount = funds.reduce((sum, f) => sum + f.amount, 0);

            const demoStocks = [
                { name: 'Reliance Industries', sector: 'Energy', funds: funds.slice(0, Math.min(3, funds.length)).map(f => f.name), weight: 8.5 },
                { name: 'HDFC Bank', sector: 'Banking', funds: funds.slice(0, Math.min(2, funds.length)).map(f => f.name), weight: 7.2 },
                { name: 'Infosys', sector: 'IT', funds: funds.slice(0, Math.min(2, funds.length)).map(f => f.name), weight: 6.8 },
                { name: 'ICICI Bank', sector: 'Banking', funds: funds.slice(0, Math.min(3, funds.length)).map(f => f.name), weight: 5.4 },
                { name: 'TCS', sector: 'IT', funds: [funds[0].name], weight: 5.1 },
                { name: 'Bharti Airtel', sector: 'Telecom', funds: [funds[0].name], weight: 4.3 },
                { name: 'Kotak Mahindra Bank', sector: 'Banking', funds: funds.length > 1 ? [funds[1].name] : [funds[0].name], weight: 3.9 },
                { name: 'Asian Paints', sector: 'Consumer', funds: [funds[0].name], weight: 3.5 }
            ];

            // Update summary
            const commonStocks = demoStocks.filter(s => s.funds.length > 1).length;
            document.getElementById('totalStocks').textContent = demoStocks.length;
            document.getElementById('commonStocks').textContent = commonStocks;
            document.getElementById('totalFunds').textContent = funds.length;
            document.getElementById('topSectorValue').textContent = 'Banking';

            // Display stocks
            const stockGrid = document.getElementById('stockGrid');
            stockGrid.innerHTML = demoStocks.map(stock => `
                <div class="stock-card">
                    <div class="stock-info">
                        <div class="stock-name">${stock.name}</div>
                        <div style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px;">
                            ${stock.sector}
                        </div>
                        <div class="fund-tags">
                            ${stock.funds.map(f => `<span class="fund-tag">${f}</span>`).join('')}
                        </div>
                    </div>
                    <div class="stock-weight">
                        <div class="weight-value">${stock.weight}%</div>
                        <div class="weight-label">of portfolio</div>
                    </div>
                </div>
            `).join('');

            // Generate insights
            const insights = document.getElementById('insightsContent');
            insights.innerHTML = `
                <ul style="line-height: 2; color: var(--text-secondary);">
                    <li>🏦 <strong>Banking sector dominance:</strong> ${(7.2 + 5.4 + 3.9).toFixed(1)}% of your portfolio is in banking stocks</li>
                    <li>💻 <strong>IT exposure:</strong> ${(6.8 + 5.1).toFixed(1)}% through Infosys and TCS</li>
                    <li>${commonStocks > 2 ? '⚠️' : '✅'} <strong>${commonStocks} stocks appear in multiple funds</strong> - ${commonStocks > 2 ? 'Consider diversifying to reduce overlap' : 'Good diversification!'}</li>
                    <li>🎯 <strong>Top holding:</strong> Reliance Industries represents ${((8.5 / 100) * totalAmount).toLocaleString('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 })} of your total portfolio</li>
                </ul>
            `;

            resultsSection.scrollIntoView({ behavior: 'smooth' });
        }

        function displayResults(data) {
            displayDemoResults();
        }
    </script>
</body>
</html>
