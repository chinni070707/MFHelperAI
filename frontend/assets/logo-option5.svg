<!-- MFHelper Logo Option 5: Modern Letter M with Chart Line -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Square Background -->
  <rect x="25" y="25" width="150" height="150" rx="30" fill="url(#blueGrad)"/>
  
  <!-- Letter M shaped as bars -->
  <path d="M 50 130 L 50 80 L 70 100 L 90 70 L 110 90 L 130 60 L 130 130 M 70 100 L 70 130 M 110 90 L 110 130" 
        stroke="white" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Helper text -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="16" font-weight="600" 
        fill="white" text-anchor="middle" opacity="0.9">HELPER</text>
</svg>
