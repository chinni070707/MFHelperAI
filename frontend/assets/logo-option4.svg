<!-- MFHelper Logo Option 4: Coin Stack with Upward Trend -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Coin Stack -->
  <ellipse cx="100" cy="140" rx="45" ry="12" fill="url(#goldGrad)"/>
  <ellipse cx="100" cy="120" rx="45" ry="12" fill="#F59E0B"/>
  <ellipse cx="100" cy="100" rx="45" ry="12" fill="url(#goldGrad)"/>
  <ellipse cx="100" cy="80" rx="45" ry="12" fill="#F59E0B"/>
  
  <!-- Upward Arrow -->
  <path d="M 100 80 L 100 30 M 85 45 L 100 30 L 115 45" 
        stroke="#10B981" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- MF on top coin -->
  <text x="100" y="85" font-family="Arial, sans-serif" font-size="18" font-weight="bold" 
        fill="white" text-anchor="middle">MF</text>
</svg>
