<!-- MFHelper Logo Option 3: Pie Chart with Money -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circle Background -->
  <circle cx="100" cy="100" r="85" fill="url(#grad1)"/>
  
  <!-- Pie Chart Slices -->
  <path d="M 100 100 L 100 40 A 60 60 0 0 1 142 75 Z" fill="white" opacity="0.9"/>
  <path d="M 100 100 L 142 75 A 60 60 0 0 1 145 130 Z" fill="white" opacity="0.7"/>
  <path d="M 100 100 L 145 130 A 60 60 0 0 1 70 145 Z" fill="white" opacity="0.5"/>
  <path d="M 100 100 L 70 145 A 60 60 0 0 1 100 40 Z" fill="white" opacity="0.3"/>
  
  <!-- Inner Circle -->
  <circle cx="100" cy="100" r="35" fill="#6366F1"/>
  
  <!-- MF Text -->
  <text x="100" y="110" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        fill="white" text-anchor="middle">MF</text>
</svg>
