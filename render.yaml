# Render.com Deployment Configuration for MFHelper
# This file defines the infrastructure needed to deploy MFHelper

services:
  # FastAPI Web Service (Backend + Frontend)
  - type: web
    name: mfhelper
    env: python
    region: singapore  # Change to: oregon, frankfurt, or singapore based on your location
    plan: free  # Options: free (sleeps after 15min), starter ($7/mo always-on)
    branch: main
    rootDir: ./
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    
    # Health check endpoint
    healthCheckPath: /health
    
    # Environment Variables
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      
      - key: DEBUG
        value: "false"
      
      - key: SECRET_KEY
        generateValue: true  # Render generates secure random value
      
      - key: JWT_SECRET_KEY
        generateValue: true  # Render generates secure random value
      
      - key: DATABASE_URL
        fromDatabase:
          name: mfhelper-db
          property: connectionString
      
      - key: REDIS_URL
        fromService:
          type: redis
          name: mfhelper-redis
          property: connectionString
      
      # AI Configuration (Disabled by default on Render)
      - key: AI_ENABLED
        value: "false"
      
      - key: AI_TYPE
        value: "ollama"
      
      # Optional: Add your API keys here or via Render Dashboard
      - key: CAMS_API_KEY
        sync: false  # Set this in Render Dashboard
      
      - key: KFINTECH_API_KEY
        sync: false  # Set this in Render Dashboard
      
      - key: SENTRY_DSN
        sync: false  # Optional: For error tracking
    
    # Auto-deploy on push to main branch
    autoDeploy: true

  # Redis Cache (Optional but recommended for production)
  # Note: Free tier expires after 30 days
  # Remove this section if you don't want Redis
  - type: redis
    name: mfhelper-redis
    region: singapore  # Should match web service region
    plan: free  # Free for 30 days
    maxmemoryPolicy: allkeys-lru  # Evict least recently used keys when memory full
    ipAllowList: []  # Allow connections from your web service

# PostgreSQL Database
databases:
  - name: mfhelper-db
    databaseName: mfhelper
    user: mfhelper
    plan: free  # Free for 90 days, then $7/mo
    # Render automatically creates database and sets DATABASE_URL
