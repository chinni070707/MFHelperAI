# Render.com Deployment Configuration for MFHelper
# This file defines the infrastructure needed to deploy MFHelper

services:
  # FastAPI Web Service (Backend + Frontend)
  - type: web
    name: mfhelper
    env: python
    region: singapore  # Change to: oregon, frankfurt, or singapore based on your location
    plan: starter  # $7/mo always-on, no cold starts
    branch: main
    rootDir: ./backend
    buildCommand: |
      echo "Running production cleanup..."
      chmod +x ../scripts/cleanup-production.sh
      bash ../scripts/cleanup-production.sh || echo "⚠️ Cleanup script not found (non-blocking)"
      echo "Installing Python dependencies..."
      pip install -r requirements.txt
      echo "Running database tests..."
      python test_db_connection.py || echo "⚠️ Warning: Database test failed (non-blocking)"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    
    # Health check endpoint
    healthCheckPath: /health
    
    # Environment Variables
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      
      - key: DEBUG
        value: "false"
      
      - key: DATABASE_URL
        value: "sqlite:///./mfhelper.db"  # Will be replaced with PostgreSQL after DB creation
      
      - key: SECRET_KEY
        generateValue: true  # Render generates secure random value
      
      - key: JWT_SECRET_KEY
        generateValue: true  # Render generates secure random value
      
      # Redis disabled for now
      # - key: REDIS_URL
      #   fromService:
      #     type: redis
      #     name: mfhelper-redis
      #     property: connectionString
      
      # AI Configuration (Disabled by default on Render)
      - key: AI_ENABLED
        value: "false"
      
      - key: AI_TYPE
        value: "ollama"
      
      # Optional: Add your API keys here or via Render Dashboard
      - key: CAMS_API_KEY
        sync: false  # Set this in Render Dashboard
      
      - key: KFINTECH_API_KEY
        sync: false  # Set this in Render Dashboard
      
      - key: SENTRY_DSN
        sync: false  # Optional: For error tracking
    
    # Auto-deploy on push to main branch
    autoDeploy: true

  # Redis Cache - DISABLED (create database first)
  # Uncomment after creating a PostgreSQL database
  # - type: redis
  #   name: mfhelper-redis
  #   region: singapore
  #   plan: free
  #   maxmemoryPolicy: allkeys-lru
  #   ipAllowList: []

# PostgreSQL Database - DISABLED (uncomment to create)
