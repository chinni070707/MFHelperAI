name: Weekly Fund Holdings Update

on:
  schedule:
    # Run every Sunday at 2 AM UTC (7:30 AM IST)
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-holdings:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          
      - name: Run database migration (if needed)
        run: |
          cd backend
          python scripts/load_holdings_to_db.py
        continue-on-error: true
        
      - name: Run weekly update
        run: |
          cd backend
          python scripts/weekly_update.py
          
      - name: Commit updated database
        run: |
          git config --global user.name "MFHelper Bot"
          git config --global user.email "bot@mfhelper.com"
          git add backend/mfhelper.db
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Weekly fund holdings update - $(date +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create summary
        run: |
          echo "✅ Weekly fund holdings update completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "📅 Date: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "🗄️ Database updated with latest holdings data" >> $GITHUB_STEP_SUMMARY
