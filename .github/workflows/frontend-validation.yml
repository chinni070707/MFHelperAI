name: Frontend Validation & E2E Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'backend/app/routes/**'
      - 'tests/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'backend/app/routes/**'
      - 'tests/**'

jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'tests/package-lock.json'
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install test dependencies
      working-directory: tests
      run: npm ci
      
    - name: Install Playwright browsers
      working-directory: tests
      run: npx playwright install --with-deps chromium
      
    - name: Install backend dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      
    - name: Initialize database
      working-directory: backend
      run: |
        echo "Initializing database schema..."
        python -c "from app.database import engine, Base; from app.models import models; Base.metadata.create_all(bind=engine); print('✅ Database initialized')"
      
    - name: Start backend server
      working-directory: backend
      run: |
        nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
        sleep 10
        echo "Backend server started"
        
    - name: Verify backend is running
      run: |
        echo "Checking backend health..."
        for i in {1..30}; do
          if curl -f http://localhost:8000/health 2>/dev/null; then
            echo "✅ Backend server is healthy"
            exit 0
          fi
          echo "Waiting for backend... attempt $i/30"
          sleep 2
        done
        echo "❌ Backend failed to start"
        cat backend/server.log || true
        exit 1
      
    - name: Run ALL E2E tests
      working-directory: tests
      run: npx playwright test --project=chromium --reporter=list,html
      continue-on-error: false
      
    - name: Print server logs on failure
      if: failure()
      run: |
        echo "=== Backend Server Logs ==="
        cat backend/server.log || echo "No server logs found"
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-test-results
        path: |
          tests/test-results/
          tests/playwright-report/
        retention-days: 7
        
    - name: Upload screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-screenshots
        path: tests/test-results/screenshots/
        retention-days: 7
